# H2 est une base intégrée : elle démarre avec l'application et ne demande
# ni installation PostgreSQL ni service séparé.
#
# Le mode "file" enregistre la base dans le dossier personnel de l'utilisateur.
# Contrairement à une base "mem", les demandes et comptes restent présents après
# l'arrêt ou le redémarrage de l'application. Le mode PostgreSQL aide H2 à
# accepter le SQL utilisé par le projet.
spring.datasource.url=jdbc:h2:file:${user.home}/caisse-contrat;MODE=PostgreSQL
# Indique explicitement à Spring quel pilote utiliser pour la base locale.
spring.datasource.driver-class-name=org.h2.Driver
# H2 est réservé au développement local ; ces identifiants sont ceux par défaut
# de cette base embarquée et ne sont pas ceux de PostgreSQL.
spring.datasource.username=sa
spring.datasource.password=
# Le port 8080 était déjà utilisé sur ce poste. 8081 devient le port de
# développement par défaut ; SERVER_PORT permet de le remplacer au lancement
# si ce port est occupé, sans modifier ce fichier ni arrêter un autre programme.
server.port=${SERVER_PORT:8081}
# Les migrations Flyway créent le schéma ; Hibernate se contente de le vérifier.
spring.jpa.hibernate.ddl-auto=validate
# Désactive le maintien automatique des connexions JPA pendant les réponses HTTP.
spring.jpa.open-in-view=false
# Garde les migrations actives aussi avec la base locale H2.
spring.flyway.enabled=true
