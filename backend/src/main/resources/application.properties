spring.application.name=backend
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
# Charge les réglages locaux facultatifs depuis backend/.env. Le fichier est
# volontairement ignoré par Git : il peut contenir le mot de passe initial.
spring.config.import=optional:file:./.env[.properties]
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# En l'absence de profil choisi explicitement, Spring utilise "local".
# Cela permet de lancer le projet sans installer PostgreSQL sur un nouveau poste.
spring.profiles.default=local
# Ces réglages PostgreSQL restent disponibles lorsqu'un profil autre que "local"
# est activé. DATABASE_URL, DATABASE_USERNAME et DATABASE_PASSWORD peuvent alors
# fournir les paramètres propres à l'environnement sans enregistrer de secrets ici.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/caisse_contrat}
spring.datasource.username=${DATABASE_USERNAME:caisse_contrat}
spring.datasource.password=${DATABASE_PASSWORD:}
# "validate" vérifie les tables sans les créer ni les supprimer : Flyway reste
# responsable de leur création et de leur évolution grâce aux migrations SQL.
spring.jpa.hibernate.ddl-auto=validate
# Évite de garder une session de base ouverte pendant toute une requête web.
spring.jpa.open-in-view=false
# Exécute les scripts src/main/resources/db/migration au démarrage.
spring.flyway.enabled=true
app.cash.rejection-min-length=${APP_CASH_REJECTION_MIN_LENGTH:10}
app.antivirus.clamd-host=${APP_ANTIVIRUS_CLAMD_HOST:}
app.antivirus.clamd-port=${APP_ANTIVIRUS_CLAMD_PORT:3310}
app.contracts.encryption-key=${APP_CONTRACTS_ENCRYPTION_KEY:}
app.cash.documents.encryption-key=${APP_CASH_DOCUMENTS_ENCRYPTION_KEY:}
